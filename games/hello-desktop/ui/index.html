<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icon.png" alt=""><div><h1>Hello Desktop</h1><p>HTML on the outside, PHP on the inside.</p></div></div>
    <div class="clock" title="sent by PHP every second"><span id="clock">--:--:--</span><small id="uptime"></small></div>
  </header>

  <main>
    <section class="editor">
      <div class="toolbar">
        <button id="open">Open…</button>
        <button id="save">Save</button>
        <button id="saveAs" class="ghost">Save as…</button>
        <span id="fileName" class="file">Untitled</span>
      </div>
      <textarea id="text" spellcheck="false" placeholder="Write here. Open, Save and closing the window go through PHP and your system's own dialogs."></textarea>
      <p id="status" class="status">Ready.</p>
    </section>

    <aside>
      <div class="card">
        <h2>Ask PHP</h2>
        <form id="greet"><input id="name" placeholder="Your name" autocomplete="off"><button>Greet</button></form>
        <p id="greeting" class="answer"></p>
      </div>
      <div class="card">
        <h2>The system</h2>
        <div class="buttons">
          <button class="ghost" data-native="message">Message box</button>
          <button class="ghost" data-native="confirm">Confirm</button>
          <button class="ghost" id="notify">Notification</button>
          <button class="ghost" data-native="folder">Pick a folder</button>
        </div>
        <p id="native" class="answer small"></p>
      </div>
      <div class="card drop" id="drop">
        <h2>Drop files here</h2>
        <ul id="dropped"><li class="muted">PHP looks at what you drop on the window.</li></ul>
      </div>
      <div class="card">
        <h2>Running on</h2>
        <dl id="info"></dl>
      </div>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
