# A desktop app (ui: webview). Every key is optional (docs/tauri.md).
game:
  id: hello-desktop
  title: "Hello Desktop"
  version: 0.1.0
  description: "The JumPHP desktop app example: a notepad whose pages are HTML and whose logic is PHP (files, native dialogs, notifications)."
  lang: en
  ui: webview                   # a desktop app (Tauri), not an SDL game: bin/jumphp app:* commands
  main: App\Main                # its boot(App $app) registers the commands the pages call
  app:
    pages: ui                   # the folder of the HTML / CSS / JS pages (served as tauri://localhost/)
    tick_hz: 60                 # frames a second when nothing happens (timers, HTTP, tasks)
    native_commands: true       # pages may call jumphp.invoke('native.open' / 'native.message' / ...)
    window:                     # the main window
      url: index.html
      width: 980
      height: 680
      min_width: 480
      min_height: 320
      resizable: true
      devtools: false           # true: the WebView inspector opens with the window
