# Enemies.
#   side       horde (attacks the free peoples) | alliance (attacks the orcs)
#   hp, speed (pixels per second), armor (light | armored | magic_resist), flying (ignores the road)
#   gold (when killed), lives (taken from the bastion when it gets through), boss
#   attack     damage per second to the soldiers / walls that stop it
#   dodge      chance to avoid an arrow, bolt or stone (not the area damage)
#   stealth    hidden: only towers near a detecting tower see it (soldiers still stop it)
#   tunnel     [from, to]: underground between these parts of the road (0..1), out of reach
#   heal       {amount, radius, every}: heals the enemies around it
#   scale      drawn bigger
