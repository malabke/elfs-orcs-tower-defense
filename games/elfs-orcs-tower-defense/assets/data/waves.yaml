# Waves per map and per attacking side (horde: the orcs attack; alliance: the free peoples attack the orc player).
#   bonus      gold when the whole wave is gone
#   next       seconds between the end of this wave's arrivals and the next wave (calling it early gives early_bonus gold per second left)
#   groups     enemies sent at once: {enemy, count, every (seconds between two), delay (seconds before the first), path}
# A map can take another map's waves: {like: map, count: x, hp: x, add: [{wave: n, enemy, count, every, delay}]}
# (counts and health scaled, groups added to wave n, 1 = the first).
early_bonus: 1.5
# hard mode: enemies' health and the starting gold multiplied
hard: {hp: 1.5, start_gold: 0.85}
