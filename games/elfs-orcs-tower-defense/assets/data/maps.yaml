# Maps: 30 x 15 tiles of 16 px (the play area is 480 x 240 under the top bar), in the order of the campaign
# (each one opens when the one before is won).
#   rows       scenery: . grass, t tree, r rock, w water, f flowers (the road, slots and bastion are drawn over it)
#   scenery    instead of rows: how much of each is scattered at random (the same each time)
#   theme      meadow | marsh | quarry | autumn | snow | ash: the colours of the ground and the trees
#   paths      waypoints in tile corners ([x, y]); the road is carved along them, 2 tiles wide.
#              Ground enemies walk the path; flying ones go straight from its first point to its last.
#              Groups of a wave without a path take the paths in turn.
#   slots      building platforms (2 x 2 tiles, [x, y] = top-left tile)
#   bastion    [x, y] top-left tile of the castle drawn at the end of the road (the last point - [1, 3])
#   hero       where the hero waits at the start: a share of the first path (0..1)
