# Towers. Each level lists what changes from the level before (level 1 = everything).
# A specialization (level 4) changes the stats of level 3.
#   cost            gold to build / to reach this level
#   kind            attack (default) | barracks (soldiers on the road) | barrier (a wall on the road) | trap (on the road)
#                   | aura (helps the towers in its range) | income (gold over time); an aura / income tower may also attack
#   damage, rate    damage per hit, seconds between two attacks (a trap: seconds to re-arm)
#   range           pixels from the centre of the tower
#   damage_type     physical | pierce | magic | fire | siege
#   targets         ground | air | both
#   crit            chance of a critical hit (x crit_mult, default 2)
#   splash          radius of area damage (pixels)
#   multishot       targets hit by one attack
#   spread          an imprecise shot lands up to this many pixels away (no homing)
#   pulse           the attack hits every enemy in range at once (drums, horns)
#   ambush          the first hit on each enemy is a critical hit
#   detect          hidden enemies in range can be seen and shot by every tower
#   projectile      arrow | orb | root | note | star | bolt | rock | pitch | spark | javelin | stone; speed 0 = instant hit
#   effects         slow {factor, time} | stun {time, chance} | burn {dps, time} | fear {distance, chance} | shred {amount, time}
#   soldiers        barracks: {count, hp, damage (per second), respawn (seconds), sprite}
#   barrier         {hp, respawn, thorns (damage per second to the enemies striking it)}
#   aura            {damage (x), rate (x, lower = faster)}
#   income          {gold, every (seconds)}
