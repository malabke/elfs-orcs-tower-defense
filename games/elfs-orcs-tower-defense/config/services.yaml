# Symfony dependency injection: every class of src/ is a service, constructors are autowired.
# Scenes (JumPHP\Scene\Scene) are public automatically: SceneManager fetches them by class name.
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  App\:
    resource: '../src/*'
    # the game's logic (plain classes created with `new`, no SDL, unit-tested) and helpers made with `new`
    exclude: '../src/{Td,Ui/MixedFont.php,Ui/Text.php}'
