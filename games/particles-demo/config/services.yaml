# Symfony dependency injection: every class of src/ is a service, constructors are autowired.
# Scenes (JumPHP\Scene\Scene) are public automatically: SceneManager fetches them by class name.
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  App\:
    resource: '../src/*'
    exclude: '../src/Entity'    # entities are created with `new`, not by the container

  # the samples of the extension (extensions/particles/doc/samples): scenes the IDE runs from their file (a gutter ▶), without adopting them into this game
  App\Extensions\Particles\:
    resource: '../../../extensions/particles/doc/samples/*'
