# The game. Every key is optional (defaults: JumPHP\Kernel\GameConfig::DEFAULTS).
project:
  id: particles-demo                  # lower case, unique: folder of the games portal, network room filter
  title: "PARTICLES"
  version: 0.1.0
  description: "Fire, fountains, snow and fireworks: the jumphp/particles engine extension at work"
  descriptions: {}              # per language, {fr: "...", en: "..."}: the playground (jumphp.net) shows the visitor's
  width: 320                    # virtual resolution (pixels of the game, scaled to the window)
  height: 180
  scale: 3                      # desktop window = 960 x 540
  background: [8, 8, 20]
  start_scene: App\Scene\ShowScene
  lang: en
  net_url: ws://localhost:8090/ws   # relay server (bin/jumphp relay up); the page can override with ?net=
  online: false
  # what `bin/jumphp test` runs headless (no window), 600 frames = 10 s of game time
  smoke:
    scene: App\Scene\ShowScene
    params: { demo: true }
  # the jumphp/particles extension (its keys: composer.json extra.jumphp.config)
  particles:
    max: 3000
    seed: 7
