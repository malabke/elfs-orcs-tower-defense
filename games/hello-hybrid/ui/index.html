<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Hybrid — panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Control panel</h1>
  <p class="muted">HTML here, SDL in the other window, PHP for both.</p>

  <label>Balls <output id="ballsOut">12</output></label>
  <input id="balls" type="range" min="1" max="200" value="12">

  <label>Speed <output id="speedOut">1.0×</output></label>
  <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1">

  <label>Colour</label>
  <div class="swatches" id="swatches"></div>

  <div class="row">
    <button id="pause">Pause</button>
    <button id="shot" class="ghost">Save a picture…</button>
  </div>

  <dl class="stats">
    <dt>Balls</dt><dd id="sBalls">–</dd>
    <dt>Bounces</dt><dd id="sBounces">–</dd>
    <dt>Game FPS</dt><dd id="sFps">–</dd>
  </dl>
  <p class="muted small">Tray icon: pause, picture, quit · Ctrl+Shift+P anywhere: pause</p>
  <script src="panel.js"></script>
</body>
</html>
