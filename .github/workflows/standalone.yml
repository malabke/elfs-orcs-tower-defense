# The micro binaries of bin/jumphp export:standalone (PHP + SDL, OpenGL, OpenAL), built by StaticPHP with JumPHP's
# registry (docker/standalone) for Linux and Windows, published as the release standalone-<key>
# (tools/standalone-key.sh): export:standalone downloads them from there. macOS (arm64, Intel): for desktop apps. Windows' can only be built on Windows
# (Visual Studio): here. Run by hand (Actions > standalone > Run workflow), after a change of docker/standalone.
# The input `extensions` makes the micro of desktop apps / hybrid games instead (docs/tauri.md): its own key.
name: standalone

on:
  workflow_dispatch:
    inputs:
      extensions:
        description: 'The list of extensions: tools/standalone-extensions.txt (games), tools/app-extensions.txt (desktop apps), tools/hybrid-extensions.txt (hybrid games)'
        default: tools/standalone-extensions.txt

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      spc: ${{ steps.key.outputs.spc }}
      php: ${{ steps.key.outputs.php }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: |
          echo "key=$(JUMPHP_STANDALONE_EXTENSIONS='${{ inputs.extensions }}' bash tools/standalone-key.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "spc=$(sed -nE 's/^ARG SPC_REF=(.+)/\1/p' docker/standalone/Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "php=8.5" >> "$GITHUB_OUTPUT"

  linux:
    needs: key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jumphp/standalone:dev docker/standalone
      - name: StaticPHP (any x86_64, glibc 2.17, docker/standalone/spc-target)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/workspace:ro" -v "$PWD/out:/out" \
            -e SPC_TARGET="$(cat docker/standalone/spc-target)" -e SPC_REGISTRIES=/workspace/docker/standalone/registry/spc.registry.yml \
            jumphp/standalone:dev sh -c 'printf "php-version: ${{ needs.key.outputs.php }}\nextensions: %s\nsapi:\n  - micro\n" "$(cat /workspace/${{ inputs.extensions }})" > craft.yml && spc craft && cp buildroot/bin/micro.sfx /out/micro-linux-x86_64.sfx || { cp -r log /out/log; exit 1; }'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-linux
          path: out/log
      - uses: actions/upload-artifact@v4
        with:
          name: micro-linux-x86_64
          path: out/micro-linux-x86_64.sfx

  windows:
    needs: key
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: jumphp
      - name: StaticPHP
        shell: pwsh
        run: |
          git clone -q https://github.com/crazywhalecc/static-php-cli.git spc
          git -C spc checkout -q ${{ needs.key.outputs.spc }}
          cd spc
          composer install -q --no-dev --no-interaction
          php ../jumphp/docker/standalone/spc-registries.php
      - name: Build (Visual Studio 2022)
        shell: pwsh
        working-directory: spc
        env:
          SPC_REGISTRIES: ${{ github.workspace }}\jumphp\docker\standalone\registry\spc.registry.yml
        run: |
          # no pcntl / posix on Windows
          $ext = ((Get-Content ../jumphp/${{ inputs.extensions }}).Trim() -split ',' | Where-Object { $_ -notin 'pcntl','posix' }) -join ','
          "php-version: ${{ needs.key.outputs.php }}`nextensions: $ext`nsapi:`n  - micro`n" | Set-Content craft.yml
          ./bin/spc doctor --auto-fix
          ./bin/spc craft
          New-Item -ItemType Directory -Force ../out | Out-Null
          Copy-Item buildroot/bin/micro.sfx ../out/micro-windows-x86_64.sfx
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows
          path: spc/log
      - uses: actions/upload-artifact@v4
        with:
          name: micro-windows-x86_64
          path: out/micro-windows-x86_64.sfx

  macos:
    # desktop apps only (tools/app-extensions.txt): the games' Mac app is bin/jumphp apple (docs/apple.md)
    needs: key
    if: inputs.extensions == 'tools/app-extensions.txt'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: jumphp
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: StaticPHP
        run: |
          git clone -q https://github.com/crazywhalecc/static-php-cli.git spc
          git -C spc checkout -q ${{ needs.key.outputs.spc }}
          cd spc
          composer install -q --no-dev --no-interaction
          php ../jumphp/docker/standalone/spc-registries.php
      - name: Build (Xcode's clang, macOS 12+)
        working-directory: spc
        env:
          SPC_REGISTRIES: ${{ github.workspace }}/jumphp/docker/standalone/registry/spc.registry.yml
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          printf 'php-version: ${{ needs.key.outputs.php }}\nextensions: %s\nsapi:\n  - micro\n' "$(cat ../jumphp/${{ inputs.extensions }})" > craft.yml
          # its tools are downloaded: once more if the network failed
          ./bin/spc doctor --auto-fix || { sleep 20; ./bin/spc doctor --auto-fix; }
          ./bin/spc craft
          mkdir -p ../out
          cp buildroot/bin/micro.sfx ../out/micro-macos-${{ matrix.arch }}.sfx
          file ../out/micro-macos-${{ matrix.arch }}.sfx
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-macos-${{ matrix.arch }}
          path: spc/log
      - uses: actions/upload-artifact@v4
        with:
          name: micro-macos-${{ matrix.arch }}
          path: out/micro-macos-${{ matrix.arch }}.sfx

  release:
    needs: [key, linux, windows, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: micro-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="standalone-${{ needs.key.outputs.key }}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --title "Standalone micro $tag" \
                 --notes "PHP ${{ needs.key.outputs.php }} (micro) with JumPHP's extensions, for bin/jumphp export:standalone."
          gh release upload "$tag" micro-*.sfx -R "$GITHUB_REPOSITORY" --clobber
