# The Tauri runtime of desktop apps (tauri/ -> libjumphp_tauri) for Linux, Windows and macOS: built, then tried on
# each system for real (games/hello-desktop: its window opens, its page loads and calls PHP through FFI), then
# published as the release tauri-<key> (tools/tauri-key.sh) that bin/jumphp tauri:download and app:export use.
# docs/tauri.md. Runs on a change of tauri/ or of the PHP side, and by hand (Actions > tauri > Run workflow).
name: tauri

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tauri/**'
      - 'engine/src/Tauri/**'
      - 'engine/src/Native/**'
      - 'tools/tauri-key.sh'
      - '.github/workflows/tauri.yml'

permissions:
  contents: write

env:
  RUST_VERSION: '1.95.0'

jobs:
  key:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=$(bash tools/tauri-key.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

  build:
    needs: key
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35 and WebKitGTK 4.1, the oldest systems Tauri 2 supports
          - { os: ubuntu-22.04, platform: linux-x86_64, file: libjumphp_tauri.so, asset: libjumphp_tauri-linux-x86_64.so }
          - { os: windows-latest, platform: windows-x86_64, file: jumphp_tauri.dll, asset: jumphp_tauri-windows-x86_64.dll }
          # one universal library (Apple silicon + Intel), tried on Apple silicon
          - { os: macos-15, platform: macos-universal, file: libjumphp_tauri.dylib, asset: libjumphp_tauri-macos-universal.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (WebKitGTK, GTK, tray, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev xvfb

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Build
        shell: bash
        working-directory: tauri
        run: |
          mkdir -p ../out
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
            lipo -create -output ../out/${{ matrix.file }} \
              target/aarch64-apple-darwin/release/${{ matrix.file }} target/x86_64-apple-darwin/release/${{ matrix.file }}
            lipo -info ../out/${{ matrix.file }}
          else
            cargo build --release --locked
            cp target/release/${{ matrix.file }} ../out/
          fi
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.file }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, mbstring
          ini-values: ffi.enable=1
          tools: composer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The example app, for real (its page must load and call PHP)
        shell: bash
        working-directory: games/hello-desktop
        env:
          JUMPHP_TAURI_LIB: ${{ github.workspace }}/out/${{ matrix.file }}
          JUMPHP_SMOKE: '1'
          JUMPHP_MAX_FRAMES: '300'
        run: |
          composer install --no-interaction --no-progress
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a php app.php
          else
            php app.php
          fi

      - name: Why Windows did not load the library
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          & $dumpbin.FullName /dependents out\${{ matrix.file }}
          & $dumpbin.FullName /imports out\${{ matrix.file }} | Select-String -Pattern '^\s+\S+\.dll$|^\s+[0-9A-F]+ \S+$' | Select-Object -First 400
          $php = Split-Path (Get-Command php).Source
          Get-ChildItem $php -Filter *.dll | Select-Object Name, Length
          python -c "import ctypes,sys; ctypes.CDLL(sys.argv[1]); print('python loads it')" out\${{ matrix.file }}

  release:
    needs: [key, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          for dir in artifacts/*/; do name="$(basename "$dir")"; cp "$dir"/* "out/$name"; done
          ls -la out
          tag="tauri-${{ needs.key.outputs.key }}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --title "Tauri runtime $tag" \
                 --notes "libjumphp_tauri (tauri/) for Linux x86_64, Windows x86_64 and macOS (universal): the runtime of JumPHP desktop apps (docs/tauri.md). bin/jumphp tauri:download / app:export use it."
          gh release upload "$tag" out/* -R "$GITHUB_REPOSITORY" --clobber
