<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JumPHP App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>JumPHP App</h1>
    <p class="muted">This page is HTML. What it shows comes from PHP.</p>
    <form id="greet">
      <input id="name" placeholder="Your name" autocomplete="off">
      <button>Say hello</button>
    </form>
    <p id="answer" class="answer"></p>
    <p class="muted">PHP's clock: <span id="clock">…</span></p>
    <button id="open" class="secondary">Open a file…</button>
    <p id="file" class="muted"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
